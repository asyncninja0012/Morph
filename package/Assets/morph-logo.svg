<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Morph</title>
<!-- Master logo: a frosted-glass ring (the wheel) with one orange wedge lifted out, the pointer at its centre.
     build/make-icons.ps1 renders every PNG and .ico from this file and morph-logo-small.svg. -->
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6B2E0A" flood-opacity=".20"/>
  </filter>
  <filter id="cursorShadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2A140A" flood-opacity=".28"/>
  </filter>
  <linearGradient id="glassFill" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".55" stop-color="#FFF2EA"/>
    <stop offset="1" stop-color="#FFDCC6"/>
  </linearGradient>
  <radialGradient id="glassGlow" gradientUnits="userSpaceOnUse" cx="150" cy="420" r="230">
    <stop offset="0" stop-color="#FF9A5C" stop-opacity=".55"/>
    <stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/>
  </radialGradient>
  <!-- Rim light on the outer edge, a soft shade on the inner edge: reads as a thick glass ring. -->
  <radialGradient id="glassRim" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="200">
    <stop offset=".61" stop-color="#C98B66" stop-opacity=".30"/>
    <stop offset=".70" stop-color="#C98B66" stop-opacity="0"/>
    <stop offset=".88" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".98" stop-color="#FFFFFF" stop-opacity=".85"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".4"/>
  </radialGradient>
  <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#E9B898"/>
  </linearGradient>
  <linearGradient id="orangeFill" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#FFA24A"/>
    <stop offset=".45" stop-color="#F7771A"/>
    <stop offset="1" stop-color="#D4520A"/>
  </linearGradient>
  <radialGradient id="orangeRim" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="200">
    <stop offset=".61" stop-color="#9E3A06" stop-opacity=".45"/>
    <stop offset=".70" stop-color="#9E3A06" stop-opacity="0"/>
    <stop offset=".86" stop-color="#FFE2C4" stop-opacity="0"/>
    <stop offset=".97" stop-color="#FFE2C4" stop-opacity=".75"/>
    <stop offset="1" stop-color="#FFE2C4" stop-opacity=".3"/>
  </radialGradient>
  <linearGradient id="orangeEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD2A6"/>
    <stop offset="1" stop-color="#B8440A"/>
  </linearGradient>
  <path id="glass" d="M436.35,212.70 A14,14 0 0 1 453.44,224.08 A200,200 0 1 1 235.73,57.03 A14,14 0 0 1 251.14,70.59 L252.46,120.77 A14,14 0 0 1 240.27,135.02 A122,122 0 1 0 376.93,239.88 A14,14 0 0 1 387.54,224.42 Z"/>
  <path id="wedge" d="M260.86,70.59 A14,14 0 0 1 276.27,57.03 A200,200 0 0 1 442.94,184.92 A14,14 0 0 1 433.83,203.32 L385.71,217.58 A14,14 0 0 1 368.79,209.49 A122,122 0 0 0 271.73,135.02 A14,14 0 0 1 259.54,120.77 Z"/>
  <path id="pointer" d="M0,-52 L36,16 L11,6 L11,44 L-11,44 L-11,6 L-36,16 Z"/>
</defs>
<g filter="url(#shadow)">
  <use href="#glass" fill="url(#glassFill)"/>
  <use href="#glass" fill="url(#glassGlow)"/>
  <use href="#glass" fill="url(#glassRim)"/>
  <use href="#glass" fill="none" stroke="url(#glassEdge)" stroke-width="2"/>
  <g transform="translate(4 -5)">
    <use href="#wedge" fill="url(#orangeFill)"/>
    <use href="#wedge" fill="url(#orangeRim)"/>
    <use href="#wedge" fill="none" stroke="url(#orangeEdge)" stroke-width="2"/>
  </g>
</g>
<!-- Pointer with a white edge, like the real Windows pointer, so it stays visible on dark taskbars. -->
<g filter="url(#cursorShadow)" transform="translate(252 268) rotate(-37) scale(1.3)" stroke-linejoin="round">
  <use href="#pointer" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="13"/>
  <use href="#pointer" fill="#3B2620" stroke="#3B2620" stroke-width="7"/>
</g>
</svg>
