name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: ./build/fetch-binaries.ps1
        shell: pwsh
      # h264_mf needs Media Foundation, which Windows Server lacks by default; media tests skip without an encoder.
      - run: Install-WindowsFeature Server-Media-Foundation
        shell: powershell
        continue-on-error: true
      - run: dotnet restore Morph.slnx
      - run: dotnet format Morph.slnx --verify-no-changes --no-restore
      - run: dotnet build Morph.slnx -c Release --no-restore
      - run: dotnet run build/gen-fixtures.cs
      # UI tests need an interactive desktop and run locally only.
      - run: dotnet test Morph.slnx -c Release --no-build --filter-not-trait "Category=UI"
      - run: ./build/pack.ps1 -Configuration Release -NoSign
        shell: pwsh
      # shortcut: report-only until the custom small FFmpeg build lands (PLAN 0.6 numbers); then drop continue-on-error.
      - run: ./build/size-check.ps1
        shell: pwsh
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: Morph_x64.msix
          path: artifacts/Morph_x64.msix
      # The release installer (D12); the MSIX above stays for the size budget (R3) and a later signed build.
      - run: ./build/installer.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Morph-setup
          path: artifacts/Morph-*-setup.exe*
