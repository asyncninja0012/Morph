name: Release

# Push a tag like v0.9.0 to build, test and publish Morph-0.9.0-setup.exe on a GitHub Release (PLAN D12, 4.6).
# The release starts as a draft: check it, then publish it on GitHub (Releases → the draft → Publish release).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: ./build/fetch-binaries.ps1
        shell: pwsh
      - run: Install-WindowsFeature Server-Media-Foundation
        shell: powershell
        continue-on-error: true
      - run: dotnet restore Morph.slnx
      - run: dotnet build Morph.slnx -c Release --no-restore
      - run: dotnet run build/gen-fixtures.cs
      - run: dotnet test Morph.slnx -c Release --no-build --filter-not-trait "Category=UI"
      - name: Build the installer
        shell: pwsh
        run: ./build/installer.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME --draft --title "Morph $version" --generate-notes `
            "artifacts/Morph-$version-setup.exe" "artifacts/Morph-$version-setup.exe.sha256"
